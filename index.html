<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#100a12">

    <title>Para você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ==============================
         CAPA
    =============================== -->

    <section id="cover" class="screen">

        <div class="floating-decoration">
            <span>✦</span>
            <span>♡</span>
            <span>✧</span>
            <span>♡</span>
            <span>✦</span>
        </div>

        <div class="cover-book">

            <div class="cover-border"></div>

            <div class="cover-symbol">✦</div>

            <span class="cover-label">
                UMA HISTÓRIA PARA GUARDAR
            </span>

            <h1>
                Momentos
                <br>
                para guardar
            </h1>

            <div class="cover-divider">
                <span>♡</span>
            </div>

            <p>
                Para você,
                <br>
                com todo meu carinho.
            </p>

            <button id="openBook" class="open-button">
                <span>Abrir o livro</span>
                <strong>→</strong>
            </button>

            <div class="cover-bottom">
                ❤️
            </div>

        </div>

    </section>


    <!-- ==============================
         LIVRO
    =============================== -->

    <section id="book" class="screen hidden">

        <header class="book-header">

            <button
                id="homeButton"
                class="header-button"
            >
                ←
            </button>

            <div class="header-title">

                <span>PARA VOCÊ</span>

                <small id="pageCounter">
                    Página 1
                </small>

            </div>

            <button
                id="editButton"
                class="header-button"
            >
                ✎
            </button>

        </header>


        <main class="book-main">

            <div class="book-shadow"></div>

            <article
                id="bookPage"
                class="mobile-book-page"
            >

                <div class="page-inner">

                    <div
                        id="pageContent"
                        class="page-content"
                    ></div>

                </div>

            </article>

        </main>


        <div class="navigation">

            <button id="previousPage">
                ‹
            </button>

            <div
                id="pageDots"
                class="page-dots"
            ></div>

            <button id="nextPage">
                ›
            </button>

        </div>

    </section>


    <!-- ==============================
         EDITOR
    =============================== -->

    <div
        id="editorPanel"
        class="overlay hidden"
    >

        <div class="editor-box">

            <div class="editor-header">

                <div>
                    <span>EDITOR DO LIVRO</span>

                    <h2>
                        Personalize esta história
                    </h2>
                </div>

                <button
                    id="closeEditor"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <label>
                Página
            </label>

            <select id="chapterSelect"></select>


            <label>
                Título
            </label>

            <input
                id="titleInput"
                type="text"
                placeholder="Título da página..."
            >


            <label>
                Subtítulo
            </label>

            <input
                id="subtitleInput"
                type="text"
                placeholder="Uma pequena frase..."
            >


            <label>
                Mensagem
            </label>

            <textarea
                id="messageInput"
                placeholder="Escreva livremente..."
            ></textarea>


            <div class="media-buttons">

                <button id="choosePhoto">
                    🖼️ Foto
                </button>

                <button id="chooseVideo">
                    🎥 Vídeo
                </button>

            </div>


            <input
                type="file"
                id="photoInput"
                accept="image/*"
                multiple
                hidden
            >

            <input
                type="file"
                id="videoInput"
                accept="video/*"
                multiple
                hidden
            >


            <div class="preview-area">

                <span>
                    Mídias desta página
                </span>

                <div
                    id="mediaPreview"
                    class="preview-grid"
                ></div>

            </div>


            <button
                id="addPage"
                class="secondary-button"
            >
                ＋ Criar nova página
            </button>


            <button
                id="savePage"
                class="save-button"
            >
                Salvar página ❤️
            </button>


            <p class="editor-warning">
                As alterações ficam salvas neste navegador.
            </p>

        </div>

    </div>


    <!-- ==============================
         VISUALIZADOR
    =============================== -->

    <div
        id="photoViewer"
        class="photo-viewer hidden"
    >

        <button
            id="closeViewer"
            class="viewer-close"
        >
            ×
        </button>

        <img
            id="viewerImage"
            src=""
            alt="Foto"
        >

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
