<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#17111f">

    <title>Para Emy ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FUNDO ANIMADO -->
    <div class="background">
        <div class="stars"></div>
        <div class="hearts"></div>
    </div>


    <!-- ========================= -->
    <!-- CAPA -->
    <!-- ========================= -->

    <section id="capa" class="tela ativa">

        <div class="capa-conteudo">

            <div class="brilho">✦</div>

            <p class="pequeno">
                Um pequeno presente para
            </p>

            <h1>Emy</h1>

            <div class="linha"></div>

            <p class="frase-capa">
                Para uma pessoa muito especial
                que merece o mundo inteiro. ❤️
            </p>

            <button class="botao-abrir" onclick="abrirLivro()">
                Abrir meu presente
                <span>❤️</span>
            </button>

            <p class="toque">
                Toque para começar
            </p>

        </div>

    </section>


    <!-- ========================= -->
    <!-- LIVRO -->
    <!-- ========================= -->

    <main id="livro" class="livro escondido">

        <!-- CONTADOR -->
        <div class="contador">
            <span id="paginaAtual">1</span>
            /
            <span id="totalPaginas">8</span>
        </div>


        <!-- PÁGINA -->
        <div class="pagina-container">

            <article id="pagina" class="pagina">

                <!-- CONTEÚDO INSERIDO PELO JAVASCRIPT -->

            </article>

        </div>


        <!-- CONTROLES -->

        <div class="controles">

            <button
                id="anterior"
                class="botao-controle"
                onclick="paginaAnterior()">
                ←
            </button>

            <div class="indicadores" id="indicadores"></div>

            <button
                id="proxima"
                class="botao-controle"
                onclick="proximaPagina()">
                →
            </button>

        </div>

    </main>


    <!-- ========================= -->
    <!-- ÁUDIO OPCIONAL -->
    <!-- ========================= -->

    <audio id="musica" loop>
        <!--
        Se quiser colocar uma música depois,
        coloque o arquivo na pasta media e altere aqui.

        Exemplo:

        <source src="media/musica.mp3" type="audio/mpeg">
        -->
    </audio>


    <script src="script.js"></script>

</body>
</html>
